{% extends "base.html" %}

{% block title %}Create Account - Cards App{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="section">
        <div class="section-header">
            <h5 class="mb-0">Create Account</h5>
        </div>
        <div class="section-body">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('register') }}" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" minlength="3" maxlength="40" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Optional</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn btn-success">Create Account</button>
                    <a class="btn btn-secondary" href="{{ url_for('login') }}">Log In</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
