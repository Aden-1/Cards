<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cards App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation bar - appears on all pages -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Cards App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('edit') }}">Edit Decks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('view') }}">Study Cards</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('match') }}">Matching Game</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('reorder') }}">Reorder Game</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <main>
        <div class="container mt-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const url = new URL(window.location.href);
        const notice = url.searchParams.get('notice');
        const level = url.searchParams.get('level') || 'success';

        if (notice) {
            const toast = document.createElement('div');
            toast.className = `feedback-message ${level === 'error' ? 'error' : 'success'}`;
            toast.textContent = notice;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.32s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2200);

            url.searchParams.delete('notice');
            url.searchParams.delete('level');
            window.history.replaceState({}, document.title, url.toString());
        }

        document.querySelectorAll('form').forEach((form) => {
            if ((form.method || '').toLowerCase() !== 'post') {
                return;
            }
            form.addEventListener('submit', function() {
                const submitButtons = form.querySelectorAll('button[type="submit"], input[type="submit"]');
                submitButtons.forEach((button) => {
                    if (button.dataset.locked === 'true') {
                        return;
                    }
                    button.dataset.locked = 'true';
                    button.disabled = true;
                    if (button.tagName === 'BUTTON') {
                        button.dataset.originalText = button.textContent;
                        button.textContent = button.dataset.loadingText || 'Saving...';
                    } else if (button.tagName === 'INPUT') {
                        button.dataset.originalValue = button.value;
                        button.value = button.dataset.loadingText || 'Saving...';
                    }
                });
            });
        });
    });
    </script>
</body>
</html>
