name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cards_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        # v5.6.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Enforce runtime dependency license policy
        run: |
          python -m piplicenses --from=mixed --format=json --output-file dependency-licenses.json
          python scripts/check_dependency_licenses.py dependency-licenses.json requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run unit and integration tests
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite://
        run: python -m unittest discover -s tests -v

      - name: Validate SQLite migrations
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite:///ci.sqlite
        run: python -m flask db upgrade

      - name: Validate PostgreSQL migrations
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cards_test
        run: python -m flask db upgrade

      - name: PostgreSQL smoke tests
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cards_test
        run: python -m unittest tests.test_postgres_smoke -v

      - name: Dependency vulnerability scan
        run: python -m pip_audit --require-hashes --requirement requirements.txt

      - name: Generate CycloneDX SBOM for locked runtime dependencies
        run: >-
          python -m pip_audit --require-hashes --requirement requirements.txt
          --format cyclonedx-json --output sbom.cdx.json

      - name: Upload CycloneDX SBOM
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cards-runtime-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Secret scan
        # v2.3.9
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
