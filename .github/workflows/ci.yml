name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cards_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run unit and integration tests
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite://
        run: python -m unittest discover -s tests -v

      - name: Validate SQLite migrations
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite:///ci.sqlite
        run: python -m flask db upgrade

      - name: Validate PostgreSQL migrations
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cards_test
        run: python -m flask db upgrade

      - name: PostgreSQL smoke tests
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cards_test
        run: python -m unittest tests.test_postgres_smoke -v

      - name: Dependency vulnerability scan
        run: python -m pip_audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
